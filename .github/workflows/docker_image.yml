name: Docker images build and push

# Tag scheme and modes: see scripts/plan_images.py (single source of truth) and the README
# "Docker image tags" section. In short:
#   :<distro>         latest release, rebuilt weekly on fresh base images   (moves)
#   :<distro>-<rel>   that release, e.g. jazzy-2610 or jazzy-2610.1         (never moves)
#   :<distro>-main    main branch, merged but not yet released              (every merge)
#   :latest           newest LTS (.github/distros.json "latest")            (with :<distro>)
# Rolling (experimental) gets floating tags only. Every tag also has -amd64 / -arm64 variants.

on:
  pull_request:
    branches:
      - main
      - dev
      - 'stabilization/**'
  push:
    branches:
      - main
    # A release tag (YYMM or YYMM.N, see release.yml) publishes immutable <distro>-<release> images and
    # moves the floating <distro> tags to it.
    tags:
      - '[0-9][0-9][0-9][0-9]'
      - '[0-9][0-9][0-9][0-9].[0-9]+'
  workflow_dispatch:
    inputs:
      release:
        description: >-
          Existing release tag (e.g. 2610 or 2610.1) to publish as <distro>-<release> + <distro>.
          Leave empty to publish <distro>-main from the selected branch.
        required: false
        default: ''
  # Weekly: rebuild the latest release on fresh base images (security updates) and move only the
  # floating tags. Immutable tags are never rebuilt.
  schedule:
    - cron: '0 4 * * 0'

jobs:
  plan:
    name: Plan images and tags
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      ref: ${{ steps.plan.outputs.ref }}
      has_work: ${{ steps.plan.outputs.has_work }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout repository (with tags)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Plan
        id: plan
        env:
          # Reaches the planner through env only, never interpolated into a script.
          INPUT_RELEASE: ${{ inputs.release }}
        run: python3 scripts/plan_images.py

      - name: Refuse to overwrite immutable release tags
        if: steps.plan.outputs.immutable != ''
        env:
          REPO: ${{ secrets.DOCKER_HUB_USERNAME }}/ros2_mcp
          IMMUTABLE: ${{ steps.plan.outputs.immutable }}
        run: |
          for tag in $IMMUTABLE; do
            if docker buildx imagetools inspect "$REPO:$tag" >/dev/null 2>&1; then
              echo "::error::$REPO:$tag already exists; release tags are immutable"; exit 1
            fi
          done

  # Pull requests: build every distro and run the end-to-end smoke test. Nothing is pushed.
  build_image:
    name: Build + smoke (${{ matrix.distro }})
    needs: plan
    if: needs.plan.outputs.mode == 'test'
    runs-on: ubuntu-latest
    # Rolling can break in place: best-effort, never fails the run or cancels the LTS builds.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Docker build (${{ matrix.distro }})
        run: docker build -t ros2_mcp --build-arg ROS_DISTRO=${{ matrix.distro }} .

      - name: ROS 2 type support smoke test (${{ matrix.distro }})
        run: scripts/smoke_e2e.sh --type-support-only ros2_mcp

      - name: End-to-end smoke, every shipped RMW (${{ matrix.distro }})
        run: scripts/smoke_e2e.sh ros2_mcp

  build_and_push_amd64:
    name: Build + smoke + push AMD64 (${{ matrix.distro }})
    needs: plan
    if: needs.plan.outputs.mode != 'test' && needs.plan.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout the ref being published
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (${{ matrix.distro }})
        run: |
          docker buildx build --platform linux/amd64 --load -t ros2_mcp \
            --build-arg ROS_DISTRO=${{ matrix.distro }} .

      # Nothing is published unless the image works against a live ROS 2 graph. Releases older
      # than the smoke test only get the type-support check (their image predates the script).
      - name: Smoke test before publishing
        run: |
          if [ -x scripts/smoke_e2e.sh ]; then
            scripts/smoke_e2e.sh --type-support-only ros2_mcp
            scripts/smoke_e2e.sh ros2_mcp
          else
            docker run --rm --entrypoint bash ros2_mcp -lc '
              source /opt/ros/$ROS_DISTRO/setup.bash && source /root/wisevision_ws/install/setup.bash &&
              /app/.venv/bin/python3 -c "from builtin_interfaces.msg import Time; from rclpy.serialization import serialize_message; serialize_message(Time(sec=1))"'
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Push AMD64 (${{ matrix.tags }})
        env:
          REPO: ${{ secrets.DOCKER_HUB_USERNAME }}/ros2_mcp
          TAGS: ${{ matrix.tags }}
          DISTRO: ${{ matrix.distro }}
        run: |
          args=(); for t in $TAGS; do args+=(--tag "$REPO:$t-amd64"); done
          docker buildx build --platform linux/amd64 --build-arg ROS_DISTRO="$DISTRO" "${args[@]}" --push .

  build_and_push_arm64:
    name: Build + push ARM64 (${{ matrix.distro }})
    needs: plan
    if: needs.plan.outputs.mode != 'test' && needs.plan.outputs.has_work == 'true'
    runs-on: wisevision-runner
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    container:
      image: ubuntu:22.04
    steps:
      - name: Checkout the ref being published
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.ref }}

      - name: Install Docker CLI
        run: |
          apt-get update
          apt-get install -y docker.io

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (${{ matrix.distro }})
        run: |
          docker buildx build --platform linux/arm64 --load -t ros2_mcp_arm64 \
            --build-arg ROS_DISTRO=${{ matrix.distro }} .

      - name: Type-support smoke test before publishing
        run: |
          docker run --rm --entrypoint bash ros2_mcp_arm64 -lc '
            source /opt/ros/$ROS_DISTRO/setup.bash && source /root/wisevision_ws/install/setup.bash &&
            /app/.venv/bin/python3 -c "from builtin_interfaces.msg import Time; from rclpy.serialization import serialize_message; serialize_message(Time(sec=1))"'

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Push ARM64 (${{ matrix.tags }})
        env:
          REPO: ${{ secrets.DOCKER_HUB_USERNAME }}/ros2_mcp
          TAGS: ${{ matrix.tags }}
          DISTRO: ${{ matrix.distro }}
        run: |
          args=(); for t in $TAGS; do args+=(--tag "$REPO:$t-arm64"); done
          docker buildx build --platform linux/arm64 --build-arg ROS_DISTRO="$DISTRO" "${args[@]}" --push .

  merge_manifests:
    name: Multi-arch tags (${{ matrix.distro }})
    needs: [plan, build_and_push_arm64, build_and_push_amd64]
    if: needs.plan.outputs.mode != 'test' && needs.plan.outputs.has_work == 'true'
    runs-on: wisevision-runner
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    container:
      image: ubuntu:22.04
    steps:
      - name: Install Docker CLI
        run: |
          apt-get update
          apt-get install -y docker.io

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Merge AMD64 + ARM64 into each multi-arch tag
        env:
          REPO: ${{ secrets.DOCKER_HUB_USERNAME }}/ros2_mcp
          TAGS: ${{ matrix.tags }}
        run: |
          for t in $TAGS; do
            docker buildx imagetools create --tag "$REPO:$t" "$REPO:$t-amd64" "$REPO:$t-arm64"
            docker buildx imagetools inspect "$REPO:$t" | head -n 3
          done
