[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp_server_ros_2"
version = "2610"
description = "ROS2 MCP: open-source MCP server for ROS 2 (Humble, Jazzy)"
readme = "README.md"
requires-python = ">=3.10"
license = "MPL-2.0"
dependencies = [
    "mcp[cli]>=1.23.0,<2",
    "starlette>=0.49.1",
    "h11>=0.16.0",
    # numpy must match the ABI the distro's ROS message extensions were built against:
    # numpy 1.x on Humble/Jazzy (Python 3.10/3.12), numpy 2.x on Lyrical/Rolling (Python 3.14).
    # Do not lift the <2.0 cap: numpy 2 cannot load the 1.x-built Humble/Jazzy extensions
    # ("A module that was compiled using NumPy 1.x cannot be run in NumPy 2.x"). The image's
    # type-support smoke test imports and serializes messages, so a mismatch fails before any push.
    "numpy>=1.21,<2.0; python_version < '3.13'",
    "numpy>=2.3,<3; python_version >= '3.13'",
    "PyYAML",
    "python-dateutil",
    "pillow>=12.3.0",
    "lark",
    "tomli>=2.0.1; python_version < '3.11'",
    # Transitive security floors (Dependabot alerts #6-18, #22-47, #51-66)
    "cryptography>=50.0.0",
    "python-multipart>=0.0.31",
    "idna>=3.15",
    "python-dotenv>=1.2.2",
    "pygments>=2.20.0",
    "anyio>=4.14.2",
    "pyjwt>=2.15.0",
]
[project.optional-dependencies]
custom-prompts = ["extension_prompts"]
[tool.uv.sources]
extension_prompts = { git = "https://github.com/wise-vision/ros2_mcp_prompts.git", rev = "dev" }

[tool.uv]
dev-dependencies = [
    "pytest>=9.0.3",
]

[project.urls]
Homepage = "https://wisevision.tech/docs"
Documentation = "https://wisevision.tech/docs"
Repository = "https://github.com/wise-vision/ros2_mcp"

[project.scripts]
mcp_ros_2_server = "server.main:main"

[tool.pytest.ini_options]
# pytest>=9 tightens pytest11 hookimpl signature validation. The ROS 2 Humble
# base image auto-registers `launch_ros` and `launch_testing` as pytest11
# entry-point plugins (ros-humble-launch-ros / ros-humble-launch-testing),
# neither of which this test suite uses. Their hookimpls don't match the
# newer pluggy/pytest hookspec and raise PluginValidationError /
# "unknown hook" errors at collection time. Disable both explicitly so the
# suite collects cleanly regardless of what's installed system-side.
addopts = "-p no:launch_ros -p no:launch_testing"

[tool.hatch.build.targets.wheel]
packages = ["server"]
include = ["server/ui/**"]

[tool.mcp_ros_2]
custom_prompts = false
prompts_local = false
prompts_path = ""
prompts_module = "extension_prompts"
