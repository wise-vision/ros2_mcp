[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp_server_ros_2"
version = "0.1.0"
description = "ROS2 MCP: open-source MCP server for ROS 2 (Humble, Jazzy)"
readme = "README.md"
requires-python = ">=3.10"
license = "MPL-2.0"
dependencies = [
    "mcp[cli]>=1.23.0",
    "starlette>=0.49.1",
    "h11>=0.16.0",
    "numpy>=1.21,<2.0",
    "PyYAML",
    "python-dateutil",
    "pillow",
    "lark",
    "tomli>=2.0.1; python_version < '3.11'",
]
[project.optional-dependencies]
custom-prompts = ["extension_prompts"]
[tool.uv.sources]
extension_prompts = { git = "https://github.com/wise-vision/ros2_mcp_prompts.git", rev = "dev" }

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://wisevision.tech/docs"
Documentation = "https://wisevision.tech/docs"
Repository = "https://github.com/wise-vision/ros2_mcp"

[project.scripts]
mcp_ros_2_server = "server.main:main"

[tool.hatch.build.targets.wheel]
packages = ["server"]
include = ["server/ui/**"]

[tool.mcp_ros_2]
custom_prompts = false
prompts_local = false
prompts_path = ""
prompts_module = "extension_prompts"
